name: Demo Version Comparison

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: "Enter new version"
        required: true
        default: "1.0.0"

jobs:
  compare-version:
    runs-on: ubuntu-latest
    steps:
      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # Pretend existing version is stored in a file
      - name: Get existing version
        id: get_existing
        run: |
          # If version.txt exists, read it, else default to 1.0.0
          if [ -f version.txt ]; then
            existing=$(cat version.txt)
          else
            existing="1.0.0"
          fi
          echo "existing_version=$existing" >> $GITHUB_OUTPUT

      # Compare versions
      - name: Compare versions
        run: |
          echo "===================================="
          echo "📌 Existing version: ${{ steps.get_existing.outputs.existing_version }}"
          echo "📌 New version:      ${{ github.event.inputs.new_version }}"
          echo "===================================="

          if [ "${{ steps.get_existing.outputs.existing_version }}" = "${{ github.event.inputs.new_version }}" ]; then
            echo "❌ Version already exists. Build skipped."
            exit 1
          else
            echo "✅ New version detected. Proceeding with build..."
          fi

      # Save new version if it's different
      - name: Save new version
        if: success()
        run: |
          echo "${{ github.event.inputs.new_version }}" > version.txt
          echo "📝 Updated version.txt with ${{ github.event.inputs.new_version }}"

      # Upload version file as artifact for reference
      - name: Upload version.txt as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: version-file
          path: version.txt
