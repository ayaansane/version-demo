name: Demo Version Comparison

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: "Enter new version"
        required: true
        default: "1.0.0"

jobs:
  compare-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push changes back to repo
    steps:
      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for commits

      # Get existing version
      - name: Get existing version
        id: get_existing
        run: |
          if [ -f version.txt ]; then
            existing=$(cat version.txt)
          else
            existing="1.0.0"
          fi
          echo "existing_version=$existing" >> $GITHUB_OUTPUT

      # Compare versions
      - name: Compare versions
        run: |
          echo "===================================="
          echo "📌 Existing version: ${{ steps.get_existing.outputs.existing_version }}"
          echo "📌 New version:      ${{ github.event.inputs.new_version }}"
          echo "===================================="

          if [ "${{ steps.get_existing.outputs.existing_version }}" = "${{ github.event.inputs.new_version }}" ]; then
            echo "❌ Version already exists. Build skipped."
            exit 1
          else
            echo "✅ New version detected. Proceeding with build..."
          fi

      # Save new version to version.txt
      - name: Save new version
        if: success()
        run: |
          echo "${{ github.event.inputs.new_version }}" > version.txt
          echo "📝 Updated version.txt with ${{ github.event.inputs.new_version }}"

      # Commit and push updated version.txt
      - name: Commit and push changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "🔖 Bump version to ${{ github.event.inputs.new_version }}"
          git push origin HEAD:${{ github.ref_name }}

      # Upload version file as artifact (optional, for download)
      - name: Upload version.txt as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: version-file
          path: version.txt
